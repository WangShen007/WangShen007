  <text class="muted" x="84" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">vision workflows</text>
  <text class="muted" x="84" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">prompt systems</text>
  <text class="muted" x="84" y="312" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">subagents</text>
  <rect class="border" x="338" y="140" width="250" height="236" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <text class="ink" x="358" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Interfaces</text>
  <line class="accent-stroke" x1="358" y1="196" x2="422" y2="196" fill="none" stroke="#0f766e" stroke-width="1.25"/>
