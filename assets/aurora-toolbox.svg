<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img">
  <defs>
    <style>
      .ink { fill: #1f2328; }
      .muted { fill: #57606a; }
      .border { fill: none; stroke: #d0d7de; }
      .accent-stroke { fill: none; stroke: #0f766e; }
      .grid-line { fill: none; stroke: #d0d7de; }
      @media (prefers-color-scheme: dark) {
        .ink { fill: #f0f3f6; }
        .muted { fill: #9aa3ad; }
        .border { stroke: #2d333b; }
        .accent-stroke { stroke: #7dd3c7; }
        .grid-line { stroke: #2d333b; }
      }
    </style>
    <pattern id="toolbox-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M40 0H0V40" fill="none" stroke="#d0d7de" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" fill="url(#toolbox-grid)"/>
  <text class="ink" x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#1f2328">Toolbox</text>
  <text class="muted" x="64" y="104" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#57606a">The stack I reach for when ideas need a reliable shape.</text>
  <rect class="border" x="64" y="140" width="250" height="236" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>
