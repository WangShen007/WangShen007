  <line class="accent-stroke" x1="906" y1="196" x2="970" y2="196" fill="none" stroke="#0f766e" stroke-width="1.25"/>
  <text class="muted" x="906" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">Rust</text>
  <text class="muted" x="906" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">SQLite / DuckDB</text>
  <text class="muted" x="906" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">Redis / MongoDB</text>
  <text class="muted" x="906" y="312" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">cross-platform tooling</text>
