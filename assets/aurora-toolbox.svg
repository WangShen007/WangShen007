  <text class="muted" x="358" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">browser extensions</text>
  <text class="muted" x="358" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">SVG / Markdown craft</text>
  <text class="muted" x="358" y="312" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">product UX</text>
