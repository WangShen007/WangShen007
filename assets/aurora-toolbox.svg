<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850" fill="#FFFFFF" text-anchor="start" opacity="1">Toolbox</text><text x="64" y="110" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#C7D7F7" text-anchor="start" opacity="1">The stack I reach for when ideas need a reliable shape.</text><rect x="64" y="155" width="238" height="210" rx="24" fill="#081227" fill-opacity=".66" stroke="#A8C7FF" stroke-opacity=".17"/><text x="88" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">AI &amp; Agents</text><text x="88" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• OpenAI-compatible APIs</text><text x="88" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• vision workflows</text><text x="88" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• prompt systems</text><text x="88" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• subagents</text><rect x="336" y="155" width="238" height="210" rx="24" fill="#081227" fill-opacity=".66" stroke="#A8C7FF" stroke-opacity=".17"/><text x="360" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Interfaces</text><text x="360" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• TypeScript / Vue</text><text x="360" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• browser extensions</text><text x="360" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• SVG / Markdown craft</text><text x="360" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• product UX</text><rect x="608" y="155" width="238" height="210" rx="24" fill="#081227" fill-opacity=".66" stroke="#A8C7FF" stroke-opacity=".17"/><text x="632" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Automation</text><text x="632" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• WebADB / WebUSB</text><text x="632" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• GitHub Actions</text><text x="632" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• Python scripts</text><text x="632" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• workflow orchestration</text><rect x="880" y="155" width="238" height="210" rx="24" fill="#081227" fill-opacity=".66" stroke="#A8C7FF" stroke-opacity=".17"/><text x="904" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Data &amp; Infra</text><text x="904" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• Rust</text><text x="904" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• SQLite / DuckDB</text><text x="904" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• Redis / MongoDB</text><text x="904" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="520" fill="#BFD0EF" text-anchor="start" opacity="1">• cross-platform tooling</text>
