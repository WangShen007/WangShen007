<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <rect width="1200" height="500" fill="#f8faf9"/>
  <text x="64" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#1f2328">Now</text>
  <text x="64" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#57606a">Current direction: turning personal workflows into small, durable agents.</text>
  <rect x="64" y="140" width="1072" height="92" rx="8" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="88" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">01</text>
  <text x="132" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Safer automation</text>
  <text x="88" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">Making automation safer with explicit plans, checkpoints and verification.</text>
  <rect x="64" y="248" width="1072" height="92" rx="8" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="88" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">02</text>
  <text x="132" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Useful products</text>
  <text x="88" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">Packaging useful AI tools so they feel less like demos and more like products.</text>
  <rect x="64" y="356" width="1072" height="92" rx="8" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="88" y="394" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">03</text>
  <text x="132" y="394" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Minimal surface</text>
  <text x="88" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#57606a">Keeping the surface minimal: fewer moving parts, clearer outcomes.</text>
</svg>
