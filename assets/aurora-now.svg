<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2d333b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="#111318"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f0f3f6">Now</text>
  <text x="64" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9aa3ad">Current direction: turning personal workflows into small, durable agents.</text>
  <rect x="64" y="140" width="1072" height="92" rx="8" fill="none" stroke="#2d333b" stroke-width="1"/>
  <text x="88" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7dd3c7">01</text>
  <text x="132" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#f0f3f6">Safer automation</text>
  <text x="88" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa3ad">Making automation safer with explicit plans, checkpoints and verification.</text>
  <rect x="64" y="248" width="1072" height="92" rx="8" fill="none" stroke="#2d333b" stroke-width="1"/>
  <text x="88" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7dd3c7">02</text>
  <text x="132" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#f0f3f6">Useful products</text>
  <text x="88" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa3ad">Packaging useful AI tools so they feel less like demos and more like products.</text>
  <rect x="64" y="356" width="1072" height="92" rx="8" fill="none" stroke="#2d333b" stroke-width="1"/>
  <text x="88" y="394" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7dd3c7">03</text>
  <text x="132" y="394" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#f0f3f6">Minimal surface</text>
  <text x="88" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa3ad">Keeping the surface minimal: fewer moving parts, clearer outcomes.</text>
</svg>
