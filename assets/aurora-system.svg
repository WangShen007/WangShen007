<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img">
  <rect width="1200" height="440" fill="#f8faf9"/>
  <text x="64" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#1f2328">Operating System</text>
  <text x="64" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#57606a">A practical loop for building tools that can actually finish work.</text>
  <rect x="64" y="150" width="520" height="96" rx="10" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="92" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">01</text>
  <text x="142" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Sense</text>
  <text x="142" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#57606a">collect signals from web, devices, repos and user workflows</text>
  <rect x="616" y="150" width="520" height="96" rx="10" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="644" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">02</text>
  <text x="694" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Plan</text>
  <text x="694" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#57606a">turn messy goals into checkable execution paths</text>
  <rect x="64" y="282" width="520" height="96" rx="10" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="92" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">03</text>
  <text x="142" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Act</text>
  <text x="142" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#57606a">operate browsers, files, APIs and mobile surfaces safely</text>
  <rect x="616" y="282" width="520" height="96" rx="10" fill="#ffffff" stroke="#d8e0dc" stroke-width="1"/>
  <text x="644" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">04</text>
  <text x="694" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Polish</text>
  <text x="694" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#57606a">make the final surface stable, readable and delightful</text>
</svg>
