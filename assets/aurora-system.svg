<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850" fill="#FFFFFF" text-anchor="start" opacity="1">Operating System</text><text x="64" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#C7D7F7" text-anchor="start" opacity="1">A practical loop for building tools that can actually finish work.</text><rect x="64" y="150" width="496" height="96" rx="24" fill="#081227" fill-opacity=".68" stroke="#A8C7FF" stroke-opacity=".18"/><text x="92" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="850" fill="#78F7D3" text-anchor="start" opacity="1">01</text><text x="142" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="780" fill="#FFFFFF" text-anchor="start" opacity="1">Sense</text><text x="142" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#AFC2E8" text-anchor="start" opacity="1">collect signals from web, devices, repos and user workflows</text><rect x="600" y="150" width="496" height="96" rx="24" fill="#081227" fill-opacity=".68" stroke="#A8C7FF" stroke-opacity=".18"/><text x="628" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="850" fill="#78F7D3" text-anchor="start" opacity="1">02</text><text x="678" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="780" fill="#FFFFFF" text-anchor="start" opacity="1">Plan</text><text x="678" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#AFC2E8" text-anchor="start" opacity="1">turn messy goals into checkable execution paths</text><rect x="64" y="282" width="496" height="96" rx="24" fill="#081227" fill-opacity=".68" stroke="#A8C7FF" stroke-opacity=".18"/><text x="92" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="850" fill="#78F7D3" text-anchor="start" opacity="1">03</text><text x="142" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="780" fill="#FFFFFF" text-anchor="start" opacity="1">Act</text><text x="142" y="354" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#AFC2E8" text-anchor="start" opacity="1">operate browsers, files, APIs and mobile surfaces safely</text><rect x="600" y="282" width="496" height="96" rx="24" fill="#081227" fill-opacity=".68" stroke="#A8C7FF" stroke-opacity=".18"/><text x="628" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="850" fill="#78F7D3" text-anchor="start" opacity="1">04</text><text x="678" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="780" fill="#FFFFFF" text-anchor="start" opacity="1">Polish</text><text x="678" y="354" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#AFC2E8" text-anchor="start" opacity="1">make the final surface stable, readable and delightful</text>
